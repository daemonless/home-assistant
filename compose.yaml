name: home-assistant

x-daemonless:
  title: "Home Assistant"
  icon: ":material-apps:"
  category: "Utilities"
  description: "Open source home automation that puts local control and privacy first."
  upstream_url: "https://github.com/daemonless/home-assistant"
  web_url: "https://www.home-assistant.io/"
  user: "bsd"
  mlock: false

  appjail:
    director:
      options:
        - "alias:"        # Required for discovery (host-like networking)
        - "ip4_inherit:"  # Required for discovery (host-like networking)

  # fjord fills this with where its names provider connects from: HA
  # refuses a forwarded request from a proxy it does not trust.
  name_env:
    TRUSTED_PROXIES: "{proxy}"

  docs:
    env:
      PUID: "User ID for the application process"
      PGID: "Group ID for the application process"
      TZ: "Timezone for the container"
      TRUSTED_PROXIES: "Proxies HA trusts, comma-separated addresses or subnets; set as its trusted proxies (with X-Forwarded-For on) at every start"
    volumes:
      /config: "Configuration directory"
    ports:
      8123: "Web UI"

services:
  home-assistant:
    image: ghcr.io/daemonless/home-assistant:latest
    container_name: home-assistant
    restart: unless-stopped
    network_mode: host  # required for mDNS/Zeroconf device discovery
    # HA's own shutdown waits for its integrations: a cast device it found
    # but cannot reach holds it ~100s. Podman's 10s default killed it
    # mid-shutdown, before it saved its state.
    stop_grace_period: 2m
    annotations:
      org.freebsd.jail.allow.raw_sockets: "true"  # required for DHCP device discovery

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC

    volumes:
      - /path/to/containers/home-assistant:/config

    # ports: not used with network_mode: host (HA listens on 8123)
